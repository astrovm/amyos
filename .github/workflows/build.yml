---
# Same file name as on main, so "Run workflow" on the debian branch runs this one.
name: Build live ISO
on:
  push:
    branches:
      - debian
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  pull_request:
    branches:
      - debian
    paths-ignore:
      - "**/README.md"

jobs:
  build_iso:
    name: Build ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # live-build needs real root to build the chroot
      - name: Build ISO
        run: sudo "$(command -v just)" build

      - name: Upload ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amyos-debian-testing-iso
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

      # Only manual runs publish a release
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debian-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" output/* \
            --target "$GITHUB_SHA" \
            --title "Amy OS Debian testing $(date -u +%Y-%m-%d)" \
            --notes "Live ISO with KDE Plasma and the Calamares installer." \
            --prerelease \
            --latest=false
