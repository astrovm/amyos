---
# Same file name as on main, so "Run workflow" on the debian branch runs this one.
name: Build live ISO
on:
  push:
    branches:
      - debian
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  pull_request:
    branches:
      - debian
    paths-ignore:
      - "**/README.md"

# A newer commit replaces the running build. Manual runs publish, so they always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: Build ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # live-build needs real root to build the chroot
      - name: Build ISO
        run: sudo "$(command -v just)" build

      - name: Upload ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amyos-debian-testing-iso-${{ matrix.arch }}
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

  # Only manual runs publish, once both ISOs build. gh is included on the runner.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build_iso
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir output
          gh release create "debian-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" output/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Amy OS Debian testing $(date -u +%Y-%m-%d)" \
            --notes "Live ISOs for AMD64 and ARM64 with KDE Plasma and the Calamares installer." \
            --prerelease \
            --latest=false
