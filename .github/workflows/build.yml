---
# Same file name as on main, so "Run workflow" on the debian branch runs this one.
name: Build Amy OS
on:
  push:
    branches:
      - main
      - debian
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - debian
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "05 10 * * *" # Daily, to pick up Fedora updates in the bootc image

# A newer commit replaces the running build. Manual runs publish, so they always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: Build ISO (${{ matrix.arch }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # live-build needs real root to build the chroot
      - name: Build ISO
        run: sudo "$(command -v just)" build

      - name: Upload ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amyos-debian-testing-iso-${{ matrix.arch }}
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

  # Only manual runs publish, once both ISOs build. gh is included on the runner.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build_iso
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir output
          gh release create "debian-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" output/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Amy OS Debian testing $(date -u +%Y-%m-%d)" \
            --notes "Live ISOs for AMD64 and ARM64 with KDE Plasma and the Calamares installer." \
            --prerelease \
            --latest=false

  # The Fedora bootc image publishes from the default branch only, never from PRs.
  build_fedora:
    name: Build Fedora image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/amyos
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      digest-amd64: ${{ steps.push.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.push.outputs.digest-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: podman build --pull=newer -f fedora/Containerfile -t "amyos:fedora-${{ matrix.arch }}" .

      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest "amyos:fedora-${{ matrix.arch }}" "${IMAGE,,}:fedora-${{ matrix.arch }}"
          echo "digest-${{ matrix.arch }}=$(cat digest)" >> "$GITHUB_OUTPUT"

  publish_fedora:
    name: Publish Fedora image
    needs: build_fedora
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/amyos
    steps:
      - name: Push multi-arch tag
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ needs.build_fedora.outputs.digest-amd64 }}
          ARM64: ${{ needs.build_fedora.outputs.digest-arm64 }}
        run: |
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create amyos-fedora "$image@$AMD64" "$image@$ARM64"
          podman manifest push --digestfile digest amyos-fedora "$image:fedora"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Old bundle format, so rpm-ostree and bootc can verify it:
      # https://github.com/coreos/rpm-ostree/issues/5509
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF"
