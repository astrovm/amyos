---
name: Build Amy OS
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "05 10 * * *" # Daily, to pick up Fedora updates in the bootc image
    - cron: "35 10 * * 1" # Weekly Debian ISOs, Monday at 10:35 UTC

# A newer commit replaces the running build. Manual runs publish, so they always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.schedule || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: Build ISO (${{ matrix.arch }})
    if: github.event_name != 'schedule' || github.event.schedule == '35 10 * * 1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # live-build needs real root to build the chroot
      - name: Build ISO
        run: sudo "$(command -v just)" build

      - name: Upload ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amyos-debian-testing-iso-${{ matrix.arch }}
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

  # Main pushes, weekly builds and manual runs publish after both ISOs pass.
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '35 10 * * 1'))
    needs: build_iso
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run IDs stay the same on retries and distinguish weekly rebuilds of a commit.
          tag="debian-$GITHUB_RUN_ID"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            echo "Release $tag is already published."
            exit 0
          fi

          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'amyos-debian-testing-iso-*' --dir output
          assets=()
          for arch in amd64 arm64; do
            files=(output/amyos-debian-testing-iso-"$arch"/*-"$arch".iso)
            if [[ ${#files[@]} != 1 || ! -f "${files[0]}" ]]; then
              echo "Expected exactly one $arch ISO" >&2
              exit 1
            fi
            iso="${files[0]}"
            if (( $(stat -c %s "$iso") >= 2 * 1024 ** 3 )); then
              echo "$iso exceeds the GitHub release size limit" >&2
              exit 1
            fi
            (cd "$(dirname "$iso")" && sha256sum --check "$(basename "$iso").sha256")
            assets+=("$iso" "$iso.sha256")
          done

          if [[ "$draft" == true ]]; then
            # Rebuilt filenames may have a new date; discard the incomplete draft.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Amy OS Debian testing $(date -u +%Y-%m-%d)" \
            --notes "Live ISOs for AMD64 and ARM64 with KDE Plasma and the Calamares installer. Each ISO is a single file; SHA256 checksums are included." \
            --draft --latest=false
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  # The Fedora bootc image publishes from the default branch only, never from PRs.
  build_fedora:
    name: Build Fedora image (${{ matrix.arch }})
    if: github.event_name != 'schedule' || github.event.schedule == '05 10 * * *'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/amyos
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      digest-amd64: ${{ steps.push.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.push.outputs.digest-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          podman build --pull=newer -f fedora/Containerfile -t "localhost/amyos:fedora-${{ matrix.arch }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=fedora.$(date -u +%Y%m%d)-${GITHUB_SHA::7}" .

      - name: Rechunk image
        run: fedora/rechunk.sh "localhost/amyos:fedora-${{ matrix.arch }}"

      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push --digestfile digest "localhost/amyos:fedora-${{ matrix.arch }}" "${IMAGE,,}:fedora-${{ matrix.arch }}"
          echo "digest-${{ matrix.arch }}=$(cat digest)" >> "$GITHUB_OUTPUT"

  publish_fedora:
    name: Publish Fedora image
    needs: build_fedora
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/amyos
    steps:
      - name: Push multi-arch tag
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AMD64: ${{ needs.build_fedora.outputs.digest-amd64 }}
          ARM64: ${{ needs.build_fedora.outputs.digest-arm64 }}
        run: |
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create amyos-fedora "$image@$AMD64" "$image@$ARM64"
          podman manifest push --digestfile digest amyos-fedora "$image:fedora"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Old bundle format, so rpm-ostree and bootc can verify it:
      # https://github.com/coreos/rpm-ostree/issues/5509
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$IMAGE_REF"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      # Artifact Hub reads the repository metadata from this tag.
      - name: Push Artifact Hub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.manifest.outputs.image }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "$IMAGE_NAME:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
