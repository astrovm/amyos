# Show "Amy OS" in the GRUB menu.
#
# grub-install also reads this file and names the EFI directory after
# GRUB_DISTRIBUTOR. Ubuntu's signed GRUB only looks in EFI/ubuntu, so keep
# "Ubuntu" there and only use the Amy OS name while grub-mkconfig runs.
if [ -n "${grub_mkconfig_dir:-}" ]; then
  GRUB_DISTRIBUTOR="Amy OS"
else
  GRUB_DISTRIBUTOR="Ubuntu"
fi
