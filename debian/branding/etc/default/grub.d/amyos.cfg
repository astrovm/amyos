# Show "Amy OS" in the GRUB menu.
#
# grub-install also reads this file and names the EFI directory after
# GRUB_DISTRIBUTOR. Debian's signed GRUB only looks in EFI/debian, so keep
# "Debian" there and only use the Amy OS name while grub-mkconfig runs.
if [ -n "${grub_mkconfig_dir:-}" ]; then
  GRUB_DISTRIBUTOR="Amy OS"
else
  GRUB_DISTRIBUTOR="Debian"
fi
