<?xml version="1.0" encoding="UTF-8"?>
<!-- Boot menu background. live-build renders it at 640x480 (BIOS) and 800x600 (UEFI). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="480" viewBox="0 0 640 480">
  <rect width="640" height="480" fill="#1b1e20"/>
  <image x="250" y="28" width="140" height="140" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>
  <text x="320" y="200" fill="#ffffff" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle">Amy OS</text>
</svg>
